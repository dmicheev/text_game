- slug: erofeev
  name_ru: Венедикт Ерофеев
  name_en: Venedikt Erofeev
  public_domain: false
  description: 'Поэма в прозе и трагический фарс одновременно. Поток трагикомических монологов с обращениями к читателю, точными
    цифрами, датами и перечнями (особенно ингредиентов и маршрутов). Пьяная эссеистика, в которой библейские, философские
    и исторические отсылки соседствуют с бытовым абсурдом. Герои-собутыльники — как античный хор: каждый со своей правдой.
    Длинные фразы, перечисления через запятую, внезапные афоризмы, нежность сквозь цинизм, горе без сентиментальности. Хронология
    поездки, станции как главы жизни, ангелы и черти в электричке.

    '
  excerpt: 'От Кремля до Петушков — четыре северных и один восточный ветер, и все они дуют мне в лицо. Я сел в вагон, достал
    из чемодана свою тоску, разлил её по стаканам, а соседям сказал: пейте, граждане, не стесняйтесь, потому что стеснение,
    как и совесть, — понятия из другой географии. За окном шёл снег вперемешку с чем-то вечным. «Ты кто?» — спросили меня.
    Я ответил, и все заплакали, а один даже засмеялся, но это уж он от себя.

    '
  temperature: 0.95
- slug: pushkin
  name_ru: Александр Пушкин
  name_en: Alexander Pushkin
  public_domain: true
  description: 'Лёгкий стихотворно-прозаический ритм, ясные короткие фразы, ирония и лёгкая насмешка над героями. Богатые
    пейзажи одной строкой, живые диалоги, афористичные концовки. Герои действуют стремительно, чувства доведены до предела,
    но выражены сдержанно.

    '
  temperature: 0.9
  excerpt: 'Любовь и рухлядь — вот и весь мой капитал. Деревня где была господская, там ныне пепелище; одни гуси, хранящие
    вечную верность пруду, да старый дьяк, который помнит меня молодым и оттого не глядит в глаза. Зима настала рано: метель
    мела третьи сутки, и в такие вечера самое время вспоминать, кто нам продал свой смех, а кто — сердце. Итого: долг за мной
    четыреста рублей, за душу — вечная память, за всё остальное — онегинская хандра.'
- slug: gogol
  name_ru: Николай Гоголь
  name_en: Nikolai Gogol
  public_domain: true
  description: 'Фантастический реализм: быт и абсурд сплетены воедино. Гипербола, гротеск, поток перечислений деталей, неожиданные
    сравнения («шаровары шириной как Чёрное море»). Повествование то лирично, то срывается в фантасмагорию, страх и мистику.

    '
  temperature: 0.95
  excerpt: Экие шапки пошли нынче в уезде! У Ивана Ивановича шаровары столь широкие, что когда он раздувает щёки и надувает
    шаровары, то походит на винную бутыль, а ветер в них свистит такою же точно музыкой. Бричка между тем катилась, ямщик
    глядел задумчиво в недоуздок, и по сторонам всё шли поля, поля, а между ними — то бурая свинья, то сорока, изволившая
    пересчитать весь провиант небогатого путника. И уже вечерняя звезда взошла над хутором, и пахло борщом и дёгтем, и где-то
    плакал чей-то кобзарь.
- slug: dostoevsky
  name_ru: Фёдор Достоевский
  name_en: Fyodor Dostoevsky
  public_domain: true
  description: 'Клочковатая, лихорадочная речь, длинные монологи-исповеди, герои спорят до изнеможения. Экзистенциальная тревога,
    чувство вины, двойники, скандалы в тесных комнатах Петербурга. Психология важнее сюжета: каждая реплика обнажает душу.

    '
  temperature: 0.85
  excerpt: «Нет-с, позвольте, я вам всё сейчас объясню, — заговорил он вдруг с страшной поспешностью, — потому что ежели не
    объясню теперь, то вы никогда, никогда не поймёте! Я подлый человек, да ведь подлость-то, может, от величия сердца моего
    происходит?» Голос его дрожал и срывался; он схватил себя за волосы, но потом махнул рукой и улыбнулся такой страдальческой
    улыбкой, что даже колокольный звон за окном показался издевательством. «Меня, сударь, в детстве в угол ставили, — прибавил
    он вдруг, ни к селу ни к городу, — а я в углу-то и думал».
- slug: tolstoy
  name_ru: Лев Толстой
  name_en: Leo Tolstoy
  public_domain: true
  description: 'Размеренная эпическая манера: подробные описания природы и интерьеров, психологизм через детали жестов и взглядов.
    Нравственные испытания героев, контрасты света и правды с фальшью света. Развёрнутые периоды, точный недраматичный язык.

    '
  temperature: 0.7
  excerpt: Все счастливые семьи похожи друг на друга, только у Ростовых опять пели в зале, и Наташа, которой никому не нужно
    было приказывать петь, стояла у рояля, не зная сама, что она сейчас заплачет или засмеётся. Князь Андрей на другой день
    вспомнил не бал, а высокий небосклон и то, как дуб, весь в коре, вдруг оказался живее всех государственных дел. И всякий
    раз, когда Наташа вспоминала свою кузину, ей становилось стыдно, но стыд этот был нежен и потому любим.
- slug: chekhov
  name_ru: Антон Чехов
  name_en: Anton Chekhov
  public_domain: true
  description: 'Короткие точные фразы, ни одного лишнего слова. Настроение создаётся деталями быта и погодой, а не прилагательными.
    Герои говорят о пустяках, промалчивая главное. Финал открыт, драма — под текстом. Смешное и грустное неразделимы.

    '
  temperature: 0.7
  excerpt: 'Был полдень. На реке тихо; только где-то стучал костяной палкой старик, да пахло от баржи дёгтем. У Ивана Иваныча
    болела голова от малокровия, но жаловаться он не привык: жалованье маленькое, жена схоронена, дела идут постольку-поскольку.
    «А ведь в Москве, братец ты мой, — сказал он и зевнул, — говорят, всё изменилось». Но и в Москве, вероятно, было так же:
    та же тоска, только с оркестром.'
- slug: turgenev
  name_ru: Иван Тургенев
  name_en: Ivan Turgenev
  public_domain: true
  description: 'Плавный музыкальный слог, туманные пейзажи как отражение чувств героев. Конфликт идеалов и слабой воли, «лишние
    люди» и сильные женщины. Тонкий психологизм, сдержанность, лирические отступления.

    '
  temperature: 0.75
  excerpt: Летний вечер гас медленно, как гаснут такие вечера только в степных краях; роса ложилась на листья с таким тихим
    звуком, будто сама ночь прислушивалась к чьему-то несказанному слову. Ася стояла у перил, и в глазах её было то выражение,
    когда человек хочет сказать всё и потому молчит. Гагин курил и глядел вдаль; что-то родное, вечное проходило в этом воздухе
    — и жаль было, что молодость даётся человеку лишь однажды, да и то впотьмах.
- slug: goncharov
  name_ru: Иван Гончаров
  name_en: Ivan Goncharov
  public_domain: true
  description: 'Обстоятельная, неторопливая манера с мягким юмором. Обстоятельный быт, подробности распорядка дня, апатия
    и «обломовщина» как состояние мира. Тёплая ирония к героям, масштабные описания покоя.

    '
  temperature: 0.7
  excerpt: 'Вставать ещё рано, а лежать надоело: так рассуждал Обломов, глядя в потолок, по которому бегала трещина, похожая
    на реку в Африке. Мысль о письме старосте была тем же самым камнем, который надо поднять — и он, приподняв её немного,
    оставил до понедельника. Захар вздыхал в передней так, что вздохи его относились скорее к судьбе вообще, чем к барину.
    «Ну, что там?» — спрашивал Обломов, и в этом вопросе была целая философия покоя.'
- slug: saltykov-shchedrin
  name_ru: Салтыков-Щедрин
  name_en: Saltykov-Shchedrin
  public_domain: true
  description: 'Едкая политическая сатира, эзопов язык, сказовая манера. Гротескные образы начальства и «премудрых пескарей».
    Ирония тяжёлая, гневная; аллегории читаются как притчи о власти и страхе.

    '
  temperature: 0.85
  excerpt: 'Помпадуры наши, как известно, народ смирный: где велено стоять — там и стоят, где велено молчать — там молчат,
    а обедают так, что газетный лист по жиру просвечивает. Город Глупов переведён был с гарнизонного на акцизное положение,
    причём обыватели не заметили разницы, ибо и прежде и после били их одинаково, с тою лишь разницей, что теперь били по
    форме. Начальник же сказал речь, в которой было слово «прогресс», и все заплакали.'
- slug: leskov
  name_ru: Николай Лесков
  name_en: Nikolai Leskov
  public_domain: true
  description: 'Сказовая манера: рассказчик-очевидец с народным умишком, богатство живой речи. Праведники и чудаки, мастерство
    простого человека. Динамичные сюжеты-предания, словечки и поговорки в тексте.

    '
  temperature: 0.85
  excerpt: 'Такое дело, милостивые государи, у нас на Туле слыхано, а у немцев и в диковинку. Мастер у нас был — Архип, и
    таков был мастер, что если крестился, то врукопашную, а если за работу садился, то уж лучше не мешайся: сделает — хоть
    в Эрмитаж, хоть церковному старосте в закрытый шкаф. Англичане его на спор вызывали, и он их, чад своих, обскакал, только
    не хвастался, а молчал и Богородицу вслух читал.'
- slug: bunin
  name_ru: Иван Бунин
  name_en: Ivan Bunin
  public_domain: true
  description: 'Дорогая, плотная проза: каждая деталь вещественна и наглядна. Память о любви как главное чувство, солнечные
    южные пейзажи, горечь расставаний. Точная, почти осязаемая образность, никакого многословия.

    '
  temperature: 0.7
  excerpt: 'На Балеарах звенели цикады, и море в полдень было так сине, что больно делалось глазам от этого платинового блеска.
    Была Пасха. Итальянка шла в чёрном, с восковой свечой, и оттого что она была красива и чужда, в сердце поднималась прежняя
    горечь: всё проходит, одна Средиземная море остаётся, да и та, наверное, не навсегда. Господи, дорогая, сказал я себе,
    за что такая жизнь — праздная, лёгкая и печальная, как этот вечер.'
- slug: kuprin
  name_ru: Александр Куприн
  name_en: Alexander Kuprin
  public_domain: true
  description: 'Жизнелюбивая, плотская проза: сильные страсти, яркие профессии и миры (цирк, армия, шахта). Динамичный сюжет,
    сочные детали, жалость к «маленькому человеку» и вера в добро.

    '
  temperature: 0.8
  excerpt: 'Поезда приходили на рассвете, и в буфете пахло мокрым ситцем, свежими булками и тем особым воздушным гарнизонным
    запахом, который бывает только в маленьких южных городах. Оля-Мещанская пела под гитару так, что офицеры переставали смеяться,
    и кто-нибудь, глядя в пол, тихо говорил: вот и вся наша карусель, господа. И правда, всё в тот год кружилось: любовь,
    карты, вокзал — и только её серые глаза оставались в памяти неподвижно.'
- slug: bulgakov
  name_ru: Михаил Булгаков
  name_en: Mikhail Bulgakov
  public_domain: true
  description: 'Мистика, врывается в быт Москвы: дьяволиада, превращения, фантасмагория рядом с очередями и коммуналками.
    Ирония над человеческой суетой, вечные вопросы вины и милосердия. Динамичные сцены, блестящие диалоги.

    '
  temperature: 0.9
  excerpt: '«Дядя Берлиоз, а вы читали Евангелие внимательно? И вообще: какие ваши доказательства существования Бога?» — спросил
    кот иотступил на задние лапы на задние лапы. Профессор же, третируя эту выходку, допил абрикосовую и заговорил про Аннушку,
    которая уже купила подсолнечное масло. И надо же: вечер был тёплый, дома — бабочки, в голове — пятый измерение, а тянуло
    на Садовую, к вечному своему проклятию и вечной же своей любви.'
- slug: zoshchenko
  name_ru: Михаил Зощенко
  name_en: Mikhail Zoshchenko
  public_domain: true
  description: 'Короткие сатирические рассказы от лица полуграмотного рассказчика: «такие-то дела», «крякнул и ушёл». Бытовые
    недоразумения раздуты до катастрофы, язык нарочно косноязычен. Финал — растерянная мораль.

    '
  temperature: 0.85
  excerpt: 'Граждане, сообщаю факт. Живёт в нашем доме Аристарх Петрович Пузырёв, человек с высшим почти образованием. И вот
    требует: дайте ему, значит, лампу в ванной переменить. А ванная — общая, казённая, и очередь туда на четверых. Председатель
    домкома ему объясняет: не положено, а он — почему да почему. Вот вам и интеллигент! А потом удивляются, откуда у нас аварии
    в санитарном узле.'
- slug: harms
  name_ru: Даниил Хармс
  name_en: Daniil Kharms
  public_domain: true
  description: 'Абсурдистская проза случая: люди внезапно падают, исчезают, превращаются. Сухой протокольный тон при полной
    нелепице происходящего. Короткие абзацы, повторы, обрыв сюжета на самом интересном месте.

    '
  temperature: 1.0
  excerpt: Был один человек, который всё время куда-то шёл. Пришёл он на Литейный, а там уже стоит другой и молчит. «Вы чего
    молчите?» — спрашивает первый. А второй упал. Тогда первый посмотрел на часы, увидел, что уже шесть, и тоже упал. Народ
    собрался. Один гражданин в очках сказал, что это, вероятно, от жары, и сам почему-то побежал. Тогда все разбежались, а
    двое так и остались лежать до вечера.
- slug: ilf-petrov
  name_ru: Ильф и Петров
  name_en: Ilf and Petrov
  public_domain: true
  description: 'Авантюрный сюжет сатирического романа: аферисты, чиновники, «великий комбинатор». Блестящие каламбуры, газетные
    штампы наизнанку, гэги в каждой сцене. Темп быстрый, ирония двойная: над героем и над эпохой.

    '
  temperature: 0.9
  excerpt: '«Лёд тронулся, господа присяжные заседатели! — сказал Остап с достоинством. — Кончаем базис, переходим к надстройке:
    продавайте, гражданин, стулья, а я вам за них дам сюжет для кино на горячую тему». Великий комбинатор любил оперировать
    крупными фактами и чужими деньгами, а на вопрос о происхождении денег отвечал скромно: «Сын лейтенанта Шмидта, между прочим,
    я — почему нет». За это его уважали даже в Новгороде.'
- slug: shakespeare
  name_ru: Уильям Шекспир
  name_en: William Shakespeare
  public_domain: true
  description: 'Высокая трагическая манера: монологи-размышления о жизни и смерти, страсти до кровавого финала, игра слов
    и остроумие слуг рядом с пафосом королей. Метафоры из природы и театра, рок висит над героями.

    '
  temperature: 0.85
  excerpt: '«О, измена вечная — где мне взять слова! — молвил принц и выхватил клинок. — Пусть рухнет мир, но правду я скажу:
    не тот король, кто славен, но кто верен». Королева молчала, и молчание её было красноречивее десяти проповедей. А над
    Эльсинором поднималась луна, и призрак отца, вздыхая, бродил по стенам, сожалея о короне, доставшейся не тому.'
- slug: dickens
  name_ru: Чарльз Диккенс
  name_en: Charles Dickens
  public_domain: true
  description: 'Викторианский роман с сердцем: сироты и скряги, туманный Лондон, комические второстепенные герои с говорящими
    фамилиями. Сентиментальность и обличение несправедливости, длинные запутанные сюжеты с узнаванием и чудом спасения.

    '
  temperature: 0.8
  excerpt: 'Лондонский туман был так густ, что фонари болтались в нём, как утопленники; на Тоули-стрит пробирались к обеду
    клерки, и у каждого в душе сидел маленький счётчик, отмечающий шиллинги и печали. Оливер держал миску и думал о том, о
    чём думают все сироты: просить ещё — грех, не просить — голод. «Ещё!» — сказал он наконец, и в этом слове уместилась вся
    социальная система старой Англии.'
- slug: twain
  name_ru: Марк Твен
  name_en: Mark Twain
  public_domain: true
  description: 'Народный юмор и авантюра: мальчишеская вольница вдоль большой реки, розыгрыши над ханжами, живой разговорный
    язык. Повествование энергичное, с подмигиванием читателю и явным удовольствием от вранья.

    '
  temperature: 0.9
  excerpt: «Слушай, Гек, — сказал Том, — если покрасить забор — это искусство, то за искусство платят, а я, с твоего позволения,
    себе на месте художника останусь». И Гек отдал яблоко за право побелить одну доску. Миссисипи катила жёлтую воду, и на
    плоту пахло рыбой, дымом и свободой, а папаша местами вылезал из болота — просить доллар и грозиться цивилизацией.
- slug: poe
  name_ru: Эдгар По
  name_en: Edgar Allan Poe
  public_domain: true
  description: 'Психологический ужас и тревога: сердце под полом, склепы, безумный рассказчик, пытающийся доказать свою вменяемость.
    Точные, почти научные описания состояния страха. Атмосфера давящая, ритм гипнотический, финал катастрофичен.

    '
  temperature: 0.85
  excerpt: 'Дом Эшеров стоял среди топей так, что тень его лежала на воде чёрнее самой воды, и я чувствовал: ещё час — и разум
    мой растворится в этой сырости. Родрик не смел назвать свой страх, но лютня его стонала по ночам, и сёстры его, леди Мадлены,
    уже не было — говорили. Сердце под полом билось всё слышнее; я хотел бежать, но любопытство — этот червь всех учёных —
    держало меня за рукав.'
- slug: o-henry
  name_ru: О. Генри
  name_en: O. Henry
  public_domain: true
  description: 'Маленькие рассказы с гигантским сюжетным поворотом в последней строке. Ирония и нежность к жителям больших
    городов: бродягам, продавщицам, неудачникам. Диалоги искромётные, сленг начала века, драматургия точно выверена.

    '
  temperature: 0.85
  excerpt: 'Дэлла сосчитала доллары восемьдесят семь центов и села перед зеркалом: волосы её спадали до колен, как река, в
    которую можно упасть. А Джим в это время смотрел на часы — последние, отцовские. К Рождеству она продала волосы и купила
    цепочку, он продал часы и купил гребни, и если бы вы спросили их об этом, оба сказали бы: а что вы хотите от бедняков
    с их фальшивой монетой в восемьдесят семь центов?'
- slug: conan-doyle
  name_ru: Артур Конан Дойл
  name_en: Arthur Conan Doyle
  public_domain: true
  description: 'Детективная классика: загадка с первых строк, метод дедукции по мелочам, рассказчик-помощник при гениальном
    герое. Викторианская Англия, туманы, погони, атмосфера загадки, развязка-объяснение.

    '
  temperature: 0.75
  excerpt: '«Ватсон, вы снова смотрите на меня как на фокусника, — сказал Холмс, набивая трубку. — Между тем всё просто: манжеты
    у вас в красной пыли, значит, были в Чарлингтоне; слева ботинок шнуровали второпях, значит, уходили из дома торопясь;
    а запах — не будем об этической стороне дела». Ватсон записал и, как всегда, восхитился: гений состоит в том, чтобы замечать
    то, что все видят, и думать о том, о чём никто не думает.'
- slug: vern
  name_ru: Жюль Верн
  name_en: Jules Verne
  public_domain: true
  description: 'Научно-приключенческая манера: точные цифры, длинноты приборов и запасов, география маршрута. Герои-энтузиасты
    науки, упрямые капитаны, подземные и подводные чудеса. Темп экспедиционный: препятствие — преодоление — триумф.

    '
  temperature: 0.7
  excerpt: '«Аксиметр показывает глубину в восемь тысяч метров, — сказал капитан Немо так спокойно, будто говорил о погоде.
    — Салон освещён электричеством, океан принадлежит нам». И действительно: за хрустальными стенами Наутилуса проплывали
    чудовища юрского периода, живые, задыхающиеся в своём великолепии. Профессор Аронакс заносил всё в дневник и не мог решить,
    что он — пленник или счастливейший из учёных.'
- slug: wells
  name_ru: Герберт Уэллс
  name_en: H. G. Wells
  public_domain: true
  description: 'Социальная фантастика: одна дерзкая научная гипотеза, вписанная в обыденную Англию. Холодный наблюдательный
    тон, катастрофа как эксперимент над обществом. Герой-учёный, толпа, страх перед будущим.

    '
  temperature: 0.7
  excerpt: 'Машина стояла в мастерской среди опилок и имела до смешного будничный вид: седло, рычаг, две фарфоровые рукоятки.
    «Время — это лишь один из видов пространства, — сказал Путешественник, отдёргивая бархат. — Я отправляюсь в год восемьсот
    тыщный». Гости промолчали: у каждого был свой скелет в шкафу, но не такой. И когда аппарат растаял в сумерках, кто-то
    сказал: «Джентльмены, за науку», — и все выпили, не чокаясь.'
- slug: kafka
  name_ru: Франц Кафка
  name_en: Franz Kafka
  public_domain: true
  description: 'Сухая канцелярская речь описывает абсурд и кошмар: суд без преступления, превращение человека в насекомое.
    Ни объяснений, ни пощады; тревога нарастает из бытовой детали. Длинные периоды, безысходность как норма.

    '
  temperature: 0.8
  excerpt: Однажды, проснувшись утром после беспокойного сна, Йозеф К. обнаружил, что процесс против него уже начался, хотя
    никто не мог сказать, кем, когда и за что. «Я невиновен», — сказал он чиновнику, но тот ответил, что невиновность — это
    вопрос юрисдикции. В коридоре суда стояли лавки и ждали те же, что и он, и все они вежливо кланялись, потому что не знали,
    кто из них судья.
- slug: lovecraft
  name_ru: Говард Лавкрафт
  name_en: H. P. Lovecraft
  public_domain: true
  description: 'Космический ужас: древние силы за гранью понимания, архаичная тяжёлая проза, «неописуемое» и «невыразимое».
    Рассказчик-учёный до последней строки не верит, а потом безумен. Туманы, портовые города, запретные книги.

    '
  temperature: 0.8
  excerpt: 'Древние говорили шёпотом, ибо знали: имена, названные вслух, обретают плоть. Город же стоял на костях того, у
    кого нет имени, и геометрия улиц была не наша, а иная — косая, враждебная. Я прочёл страницу аль-Хазреда и сжёг бы её,
    да поздно: по ночам скребётся то, что я сам впустил словом. Рассудок, думал я, есть лишь узкая полоска дневного света
    между двумя безднами.'
- slug: austen
  name_ru: Джейн Остин
  name_en: Jane Austen
  public_domain: true
  description: 'Тонкая ирония над манерами и матримониальными расчётами. Блестящие диалоги-фехтование, светские визиты, сплетни
    и гордость, мешающая счастью. Язык изящный, точный, с безжалостной интонацией автора.

    '
  temperature: 0.75
  excerpt: '«Признайтесь, мисс Беннет, — сказал Дарси, — вы решили меня дразнить, дабы скрыть, что я вам не безразличен».
    — «О нет, сэр: дразню я из принципа, а безразличие моё продумано, как ваш парк». Все вокруг искали состояние и партию,
    но Элизабет искала уважения к себе, и в этом её ошибка — или, быть может, единственная её роскошь. Мать её тем временем
    выдавала младших дочерей, как карты, одна за другой.'
- slug: maupassant
  name_ru: Ги де Мопассан
  name_en: Guy de Maupassant
  public_domain: true
  description: 'Отточенные короткие рассказы с жестокой развязкой: человеческая природа под нож. Чувственность, война, честолюбие,
    мелкие страсти. Плотская конкретика, холодный взгляд, экономный стиль.

    '
  temperature: 0.8
  excerpt: 'Она была из тех маленьких нормандок, у которых глаза серые, приданое — тонкое, а мечта — толстая. Муж её, клерк,
    обожал её и потому влез в долг за платье; на бале она была прекрасна, и все офицеры танцевали с ней, а платил за это честный
    малый с усталыми глазами. Утром она глядела на себя в осколок зеркала и не узнала: счастье, как всё дешёвое, не держится
    и ночи.'
- slug: stevenson
  name_ru: Роберт Льюис Стивенсон
  name_en: Robert Louis Stevenson
  public_domain: true
  description: 'Романтика приключений: карта, корабль, опасность и честь. Двойственность человека (Джекил и Хайд), морские
    бури, погони. Ясный энергичный слог, главы-картины, поднятый парус как состояние души.

    '
  temperature: 0.8
  excerpt: 'Карта лежала под ставнем, и крест на ней дрожал, как дрожит всякий, кто видел флинтовское золото. «Подъём якорей!
    — сказал сквайр. — И пусть каждый получит свою долю — по заслугам и по морскому праву». Джим смотрел на горизонт: там,
    за синей полосой, лежал остров, и одноногий повар уже напевал про пятнадцать человек на сундук мертвеца, и в этой песне
    был весь сценарий будущего бунта.'
- slug: king
  name_ru: Стивен Кинг
  name_en: Stephen King
  public_domain: false
  description: 'Обстоятельная разговорная проза маленького американского городка: быт, бренды, подростки, прошлые травмы.
    Ужас вырастает из будничной детали, темп нарастает короткими главами. Внутренние голоса героев, повторяющиеся фразы-маркеры,
    финал расплаты.

    '
  temperature: 0.85
- slug: pratchett
  name_ru: Терри Пратчетт
  name_en: Terry Pratchett
  public_domain: false
  description: 'Плоский юмор вглубь: пародия на фэнтези-канон, сноски-шутки, абсурдная бюрократия и героизм обывателей. Темп
    стремительный, каламбуры плотные, за смешным — человечность. Смерть говорит КАПСОМ.

    '
  temperature: 0.95
- slug: douglas-adams
  name_ru: Дуглас Адамс
  name_en: Douglas Adams
  public_domain: false
  description: 'Абсурдистская фантастика с абсолютно серьёзной интонацией BBC: полотенце, депрессивный робот, справочник по
    галактике. Юмор строится на логических тупиках и канцелярской точности при полной чепухе. Ироничные отступления в скобках.

    '
  temperature: 0.95
- slug: murakami
  name_ru: Харуки Мураками
  name_en: Haruki Murakami
  public_domain: false
  description: 'Скука одиночества, внезапно прорезанная мистикой: кошки, колодцы, джазовые пластинки, странные женщины. Ровный
    будничный тон, готовка еды и бег как ритуал. Реальность истончается без объяснений.

    '
  temperature: 0.85
- slug: bradbury
  name_ru: Рэй Брэдбери
  name_en: Ray Bradbury
  public_domain: false
  description: 'Лирическая фантастика-ностальгия: лето, велосипед, запах зелени, Марс как средний запад. Метафоры тёплые и
    плотные, грусть по детству, технофобия с человеческим лицом. Короткие поэтичные главы.

    '
  temperature: 0.9
- slug: borges
  name_ru: Хорхе Луис Борхес
  name_en: Jorge Luis Borges
  public_domain: false
  description: 'Эссе-притчи как вымышленная учёность: библиотеки бесконечности, лабиринты, зеркала. Холодная энциклопедическая
    интонация при метафизическом сюжете. Короткие тексты-головоломки, отсылки к несуществующим книгам.

    '
  temperature: 0.8
- slug: marquez
  name_ru: Габриэль Гарсиа Маркес
  name_en: Gabriel Garcia Marquez
  public_domain: false
  description: 'Магический реализм: левитация и призраки как бытовая мелочь, сто лет одной семьи в жарком городке. Круговое
    время, повторы имён, гипербола, интонация деда-сказочника. Любовь, старость, память, дожди на четыре года.

    '
  temperature: 0.9
- slug: strugatsky
  name_ru: братья Стругацкие
  name_en: Strugatsky brothers
  public_domain: false
  description: 'Советская фантастика идей: прогрессорство, мир Полдня, трагический выбор исследователя. Разговорные диалоги
    интеллектуалов, юмор, грусть по несбывшемуся будущему. Мир описан через быт экспедиции и дорожные разговоры.

    '
  temperature: 0.8
- slug: pelevin
  name_ru: Виктор Пелевин
  name_en: Victor Pelevin
  public_domain: false
  description: 'Постмодернистская ирония: буддизм, реклама, внутренние монологи поколения потребления. Герои-пустоты, психоделические
    погружения, сатира на медиареальность. Стиль — стилизации: текст меняет манеру как маску.

    '
  temperature: 0.9
- slug: akunin
  name_ru: Борис Акунин
  name_en: Boris Akunin
  public_domain: false
  description: 'Изысканный детектив-стилизация под рубеж веков: элегантный сыщик, игра жанрами (шпионский роман, нуар, дорожное
    приключение). Точная старомодная лексика, ирония автора, интрига в каждой главе, детальные исторические декорации.

    '
  temperature: 0.8
