- slug: pushkin
  name_ru: Александр Пушкин
  name_en: Alexander Pushkin
  public_domain: true
  description: >
    Лёгкий стихотворно-прозаический ритм, ясные короткие фразы, ирония и лёгкая насмешка
    над героями. Богатые пейзажи одной строкой, живые диалоги, афористичные концовки.
    Герои действуют стремительно, чувства доведены до предела, но выражены сдержанно.
  temperature: 0.9

- slug: gogol
  name_ru: Николай Гоголь
  name_en: Nikolai Gogol
  public_domain: true
  description: >
    Фантастический реализм: быт и абсурд сплетены воедино. Гипербола, гротеск, поток
    перечислений деталей, неожиданные сравнения («шаровары шириной как Чёрное море»).
    Повествование то лирично, то срывается в фантасмагорию, страх и мистику.
  temperature: 0.95

- slug: dostoevsky
  name_ru: Фёдор Достоевский
  name_en: Fyodor Dostoevsky
  public_domain: true
  description: >
    Клочковатая, лихорадочная речь, длинные монологи-исповеди, герои спорят до изнеможения.
    Экзистенциальная тревога, чувство вины, двойники, скандалы в тесных комнатах Петербурга.
    Психология важнее сюжета: каждая реплика обнажает душу.
  temperature: 0.85

- slug: tolstoy
  name_ru: Лев Толстой
  name_en: Leo Tolstoy
  public_domain: true
  description: >
    Размеренная эпическая манера: подробные описания природы и интерьеров, психологизм
    через детали жестов и взглядов. Нравственные испытания героев, контрасты света и
    правды с фальшью света. Развёрнутые периоды, точный недраматичный язык.
  temperature: 0.7

- slug: chekhov
  name_ru: Антон Чехов
  name_en: Anton Chekhov
  public_domain: true
  description: >
    Короткие точные фразы, ни одного лишнего слова. Настроение создаётся деталями быта
    и погодой, а не прилагательными. Герои говорят о пустяках, промалчивая главное.
    Финал открыт, драма — под текстом. Смешное и грустное неразделимы.
  temperature: 0.7

- slug: turgenev
  name_ru: Иван Тургенев
  name_en: Ivan Turgenev
  public_domain: true
  description: >
    Плавный музыкальный слог, туманные пейзажи как отражение чувств героев. Конфликт
    идеалов и слабой воли, «лишние люди» и сильные женщины. Тонкий психологизм,
    сдержанность, лирические отступления.
  temperature: 0.75

- slug: goncharov
  name_ru: Иван Гончаров
  name_en: Ivan Goncharov
  public_domain: true
  description: >
    Обстоятельная, неторопливая манера с мягким юмором. Обстоятельный быт, подробности
    распорядка дня, апатия и «обломовщина» как состояние мира. Тёплая ирония к героям,
    масштабные описания покоя.
  temperature: 0.7

- slug: saltykov-shchedrin
  name_ru: Салтыков-Щедрин
  name_en: Saltykov-Shchedrin
  public_domain: true
  description: >
    Едкая политическая сатира, эзопов язык, сказовая манера. Гротескные образы начальства
    и «премудрых пескарей». Ирония тяжёлая, гневная; аллегории читаются как притчи
    о власти и страхе.
  temperature: 0.85

- slug: leskov
  name_ru: Николай Лесков
  name_en: Nikolai Leskov
  public_domain: true
  description: >
    Сказовая манера: рассказчик-очевидец с народным умишком, богатство живой речи.
    Праведники и чудаки, мастерство простого человека. Динамичные сюжеты-предания,
    словечки и поговорки в тексте.
  temperature: 0.85

- slug: bunin
  name_ru: Иван Бунин
  name_en: Ivan Bunin
  public_domain: true
  description: >
    Дорогая, плотная проза: каждая деталь вещественна и наглядна. Память о любви как
    главное чувство, солнечные южные пейзажи, горечь расставаний. Точная, почти
    осязаемая образность, никакого многословия.
  temperature: 0.7

- slug: kuprin
  name_ru: Александр Куприн
  name_en: Alexander Kuprin
  public_domain: true
  description: >
    Жизнелюбивая, плотская проза: сильные страсти, яркие профессии и миры (цирк, армия,
    шахта). Динамичный сюжет, сочные детали, жалость к «маленькому человеку» и вера
    в добро.
  temperature: 0.8

- slug: bulgakov
  name_ru: Михаил Булгаков
  name_en: Mikhail Bulgakov
  public_domain: true
  description: >
    Мистика, врывается в быт Москвы: дьяволиада, превращения, фантасмагория рядом
    с очередями и коммуналками. Ирония над человеческой суетой, вечные вопросы вины
    и милосердия. Динамичные сцены, блестящие диалоги.
  temperature: 0.9

- slug: zoshchenko
  name_ru: Михаил Зощенко
  name_en: Mikhail Zoshchenko
  public_domain: true
  description: >
    Короткие сатирические рассказы от лица полуграмотного рассказчика: «такие-то дела»,
    «крякнул и ушёл». Бытовые недоразумения раздуты до катастрофы, язык нарочно
    косноязычен. Финал — растерянная мораль.
  temperature: 0.85

- slug: harms
  name_ru: Даниил Хармс
  name_en: Daniil Kharms
  public_domain: true
  description: >
    Абсурдистская проза случая: люди внезапно падают, исчезают, превращаются.
    Сухой протокольный тон при полной нелепице происходящего. Короткие абзацы,
    повторы, обрыв сюжета на самом интересном месте.
  temperature: 1.0

- slug: ilf-petrov
  name_ru: Ильф и Петров
  name_en: Ilf and Petrov
  public_domain: true
  description: >
    Авантюрный сюжет сатирического романа: аферисты, чиновники, «великий комбинатор».
    Блестящие каламбуры, газетные штампы наизнанку, гэги в каждой сцене. Темп быстрый,
    ирония двойная: над героем и над эпохой.
  temperature: 0.9

- slug: shakespeare
  name_ru: Уильям Шекспир
  name_en: William Shakespeare
  public_domain: true
  description: >
    Высокая трагическая манера: монологи-размышления о жизни и смерти, страсти до
    кровавого финала, игра слов и остроумие слуг рядом с пафосом королей. Метафоры
    из природы и театра, рок висит над героями.
  temperature: 0.85

- slug: dickens
  name_ru: Чарльз Диккенс
  name_en: Charles Dickens
  public_domain: true
  description: >
    Викторианский роман с сердцем: сироты и скряги, туманный Лондон, комические
    второстепенные герои с говорящими фамилиями. Сентиментальность и обличение
    несправедливости, длинные запутанные сюжеты с узнаванием и чудом спасения.
  temperature: 0.8

- slug: twain
  name_ru: Марк Твен
  name_en: Mark Twain
  public_domain: true
  description: >
    Народный юмор и авантюра: мальчишеская вольница вдоль большой реки, розыгрыши
    над ханжами, живой разговорный язык. Повествование энергичное, с подмигиванием
    читателю и явным удовольствием от вранья.
  temperature: 0.9

- slug: poe
  name_ru: Эдгар По
  name_en: Edgar Allan Poe
  public_domain: true
  description: >
    Психологический ужас и тревога: сердце под полом, склепы, безумный рассказчик,
    пытающийся доказать свою вменяемость. Точные, почти научные описания состояния
    страха. Атмосфера давящая, ритм гипнотический, финал катастрофичен.
  temperature: 0.85

- slug: o-henry
  name_ru: О. Генри
  name_en: O. Henry
  public_domain: true
  description: >
    Маленькие рассказы с гигантским сюжетным поворотом в последней строке. Ирония
    и нежность к жителям больших городов: бродягам, продавщицам, неудачникам.
    Диалоги искромётные, сленг начала века, драматургия точно выверена.
  temperature: 0.85

- slug: conan-doyle
  name_ru: Артур Конан Дойл
  name_en: Arthur Conan Doyle
  public_domain: true
  description: >
    Детективная классика: загадка с первых строк, метод дедукции по мелочам,
    рассказчик-помощник при гениальном герое. Викторианская Англия, туманы,
    погони, атмосфера загадки, развязка-объяснение.
  temperature: 0.75

- slug: vern
  name_ru: Жюль Верн
  name_en: Jules Verne
  public_domain: true
  description: >
    Научно-приключенческая манера: точные цифры, длинноты приборов и запасов,
    география маршрута. Герои-энтузиасты науки, упрямые капитаны, подземные
    и подводные чудеса. Темп экспедиционный: препятствие — преодоление — триумф.
  temperature: 0.7

- slug: wells
  name_ru: Герберт Уэллс
  name_en: H. G. Wells
  public_domain: true
  description: >
    Социальная фантастика: одна дерзкая научная гипотеза, вписанная в обыденную
    Англию. Холодный наблюдательный тон, катастрофа как эксперимент над обществом.
    Герой-учёный, толпа, страх перед будущим.
  temperature: 0.7

- slug: kafka
  name_ru: Франц Кафка
  name_en: Franz Kafka
  public_domain: true
  description: >
    Сухая канцелярская речь описывает абсурд и кошмар: суд без преступления,
    превращение человека в насекомое. Ни объяснений, ни пощады; тревога нарастает
    из бытовой детали. Длинные периоды, безысходность как норма.
  temperature: 0.8

- slug: lovecraft
  name_ru: Говард Лавкрафт
  name_en: H. P. Lovecraft
  public_domain: true
  description: >
    Космический ужас: древние силы за гранью понимания, архаичная тяжёлая проза,
    «неописуемое» и «невыразимое». Рассказчик-учёный до последней строки не верит,
    а потом безумен. Туманы, портовые города, запретные книги.
  temperature: 0.8

- slug: austen
  name_ru: Джейн Остин
  name_en: Jane Austen
  public_domain: true
  description: >
    Тонкая ирония над манерами и матримониальными расчётами. Блестящие диалоги-фехтование,
    светские визиты, сплетни и гордость, мешающая счастью. Язык изящный, точный,
    с безжалостной интонацией автора.
  temperature: 0.75

- slug: maupassant
  name_ru: Ги де Мопассан
  name_en: Guy de Maupassant
  public_domain: true
  description: >
    Отточенные короткие рассказы с жестокой развязкой: человеческая природа под нож.
    Чувственность, война, честолюбие, мелкие страсти. Плотская конкретика, холодный
    взгляд, экономный стиль.
  temperature: 0.8

- slug: stevenson
  name_ru: Роберт Льюис Стивенсон
  name_en: Robert Louis Stevenson
  public_domain: true
  description: >
    Романтика приключений: карта, корабль, опасность и честь. Двойственность человека
    (Джекил и Хайд), морские бури, погони. Ясный энергичный слог, главы-картины,
    поднятый парус как состояние души.
  temperature: 0.8

- slug: king
  name_ru: Стивен Кинг
  name_en: Stephen King
  public_domain: false
  description: >
    Обстоятельная разговорная проза маленького американского городка: быт, бренды,
    подростки, прошлые травмы. Ужас вырастает из будничной детали, темп нарастает
    короткими главами. Внутренние голоса героев, повторяющиеся фразы-маркеры,
    финал расплаты.
  temperature: 0.85

- slug: pratchett
  name_ru: Терри Пратчетт
  name_en: Terry Pratchett
  public_domain: false
  description: >
    Плоский юмор вглубь: пародия на фэнтези-канон, сноски-шутки, абсурдная бюрократия
    и героизм обывателей. Темп стремительный, каламбуры плотные, за смешным —
    человечность. Смерть говорит КАПСОМ.
  temperature: 0.95

- slug: douglas-adams
  name_ru: Дуглас Адамс
  name_en: Douglas Adams
  public_domain: false
  description: >
    Абсурдистская фантастика с абсолютно серьёзной интонацией BBC: полотенце,
    депрессивный робот, справочник по галактике. Юмор строится на логических
    тупиках и канцелярской точности при полной чепухе. Ироничные отступления
    в скобках.
  temperature: 0.95

- slug: murakami
  name_ru: Харуки Мураками
  name_en: Haruki Murakami
  public_domain: false
  description: >
    Скука одиночества, внезапно прорезанная мистикой: кошки, колодцы, джазовые
    пластинки, странные женщины. Ровный будничный тон, готовка еды и бег как ритуал.
    Реальность истончается без объяснений.
  temperature: 0.85

- slug: bradbury
  name_ru: Рэй Брэдбери
  name_en: Ray Bradbury
  public_domain: false
  description: >
    Лирическая фантастика-ностальгия: лето, велосипед, запах зелени, Марс как
    средний запад. Метафоры тёплые и плотные, грусть по детству, технофобия
    с человеческим лицом. Короткие поэтичные главы.
  temperature: 0.9

- slug: borges
  name_ru: Хорхе Луис Борхес
  name_en: Jorge Luis Borges
  public_domain: false
  description: >
    Эссе-притчи как вымышленная учёность: библиотеки бесконечности, лабиринты,
    зеркала. Холодная энциклопедическая интонация при метафизическом сюжете.
    Короткие тексты-головоломки, отсылки к несуществующим книгам.
  temperature: 0.8

- slug: marquez
  name_ru: Габриэль Гарсиа Маркес
  name_en: Gabriel Garcia Marquez
  public_domain: false
  description: >
    Магический реализм: левитация и призраки как бытовая мелочь, сто лет одной
    семьи в жарком городке. Круговое время, повторы имён, гипербола, интонация
    деда-сказочника. Любовь, старость, память, дожди на четыре года.
  temperature: 0.9

- slug: strugatsky
  name_ru: братья Стругацкие
  name_en: Strugatsky brothers
  public_domain: false
  description: >
    Советская фантастика идей: прогрессорство, мир Полдня, трагический выбор
    исследователя. Разговорные диалоги интеллектуалов, юмор, грусть по несбывшемуся
    будущему. Мир описан через быт экспедиции и дорожные разговоры.
  temperature: 0.8

- slug: pelevin
  name_ru: Виктор Пелевин
  name_en: Victor Pelevin
  public_domain: false
  description: >
    Постмодернистская ирония: буддизм, реклама, внутренние монологи поколения
    потребления. Герои-пустоты, психоделические погружения, сатира на медиареальность.
    Стиль — стилизации: текст меняет манеру как маску.
  temperature: 0.9

- slug: akunin
  name_ru: Борис Акунин
  name_en: Boris Akunin
  public_domain: false
  description: >
    Изысканный детектив-стилизация под рубеж веков: элегантный сыщик, игра жанрами
    (шпионский роман, нуар, дорожное приключение). Точная старомодная лексика,
    ирония автора, интрига в каждой главе, детальные исторические декорации.
  temperature: 0.8
