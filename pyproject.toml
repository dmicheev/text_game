[project]
name = "bot-game-book"
version = "0.1.0"
description = "Multiplayer broken-telephone book game Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
]

[project.scripts]
bot = "bot_game_book.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_game_book"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
